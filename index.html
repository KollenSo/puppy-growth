<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EB" />
  <meta name="description" content="小狗養成 · 儲錢就大隻" />
  <title>小狗養成</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="shell home-shell">
    <header class="topbar">
      <a class="brand brand-link" href="index.html">
        <span class="brand-mark" aria-hidden="true">🐾</span>
        <span class="brand-text">
          <span class="brand-title">小狗養成</span>
          <span class="tagline">儲錢 → 狗長大</span>
        </span>
      </a>
      <div class="top-right">
              <nav class="site-nav" aria-label="導覽">
        <a href="index.html" class="active">養成</a>
        <a href="portfolio.html">組合</a>
        <a href="expenses.html">開支</a>
      </nav>
        <button type="button" class="icon-btn" id="btnMute" aria-label="靜音">🔇</button>
      </div>
    </header>

    <div id="statusBanner" class="banner" hidden></div>

    <!-- Hero: puppy + stage + % + milestones only -->
    <section class="card hero">
      <div class="scene" id="puppyStage" data-stage="0">
        <div class="fx" id="fxLayer" aria-hidden="true"></div>
        <div class="food-fly" id="foodFly" hidden aria-hidden="true">🍖</div>
        <div class="pup-frame">
          <img class="pup-img idle" id="puppyImg" src="assets/stages/stage-0.jpg" alt="新生小狗" width="240" height="240" draggable="false" />
          <div class="ground-shadow"></div>
        </div>
        <p class="stage-pill" id="stageBadge">階段 1／5</p>
        <h1 class="stage-title" id="stageName">新生小狗</h1>
        <p class="hero-pct" id="progressPct">0%</p>
        <p class="stage-tip" id="stageTip" hidden></p>
        <p class="stage-desc" id="stageDesc" hidden></p>
      </div>

      <div class="milestone" aria-label="成長里程碑">
        <div class="milestone-track">
          <div class="milestone-fill" id="barFill"></div>
        </div>
        <ol class="milestone-nodes" id="milestoneNodes">
          <li data-at="0" class="current"><span class="dot"></span><span class="lbl">0%</span></li>
          <li data-at="10"><span class="dot"></span><span class="lbl">10%</span></li>
          <li data-at="25"><span class="dot"></span><span class="lbl">25%</span></li>
          <li data-at="50"><span class="dot"></span><span class="lbl">50%</span></li>
          <li data-at="75"><span class="dot"></span><span class="lbl">75%</span></li>
        </ol>
      </div>

      <div class="hero-money">
        <span><span class="lbl">已計入</span> <strong id="totalHkd">$0</strong></span>
        <span class="sep">·</span>
        <span><span class="lbl">目標</span> <strong id="goalHkd">$48,000</strong></span>
      </div>

      <!-- hidden compat for app.js -->
      <div id="barTrack" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
      <svg hidden aria-hidden="true"><circle id="ringFg"></circle></svg>
      <div id="breakdown" hidden></div>
      <p id="monthlyTip" hidden></p>
      <span id="asOfLabel" hidden></span>
    </section>

    <!-- Compact cream dock under hero -->
    <nav class="cream-dock" aria-label="互動">
      <button type="button" class="dock-btn feed" id="btnFeed">
        <span class="dock-ico">🍖</span><span class="dock-txt">餵食</span>
        <span class="dock-cd" id="feedCd" hidden></span>
      </button>
      <button type="button" class="dock-btn play" id="btnPlay">
        <span class="dock-ico">🎾</span><span class="dock-txt">玩耍</span>
        <span class="dock-cd" id="playCd" hidden></span>
      </button>
      <button type="button" class="dock-btn pet" id="btnPet">
        <span class="dock-ico">✋</span><span class="dock-txt">摸摸</span>
        <span class="dock-cd" id="petCd" hidden></span>
      </button>
    </nav>

    <!-- Mood behind one disclosure -->
    <details class="mood-disclosure">
      <summary>
        <span class="mood-sum-label">心情</span>
        <span class="mood-sum-vals" id="moodSummary">飽 80 · 開 80 · 親 50</span>
      </summary>
      <div class="mood-row">
        <div class="mood-item">
          <span>飽肚</span>
          <div class="meter-track"><div class="meter-fill hunger" id="hungerFill"></div></div>
          <span class="mood-val" id="hungerVal">80</span>
        </div>
        <div class="mood-item">
          <span>開心</span>
          <div class="meter-track"><div class="meter-fill happy" id="happyFill"></div></div>
          <span class="mood-val" id="happyVal">80</span>
        </div>
        <div class="mood-item">
          <span>親密</span>
          <div class="meter-track"><div class="meter-fill affection" id="affectionFill"></div></div>
          <span class="mood-val" id="affectionVal">50</span>
        </div>
      </div>
    </details>

    <footer class="foot">
      <p class="note">養成由 $0 起計 · 帳戶結餘僅作參考</p>
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
