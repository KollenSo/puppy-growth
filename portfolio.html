<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EB" />
  <meta name="description" content="組合回報" />
  <title>組合 · 小狗養成</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="shell portfolio-shell">
    <header class="topbar">
      <a class="brand brand-link" href="index.html">
        <span class="brand-mark" aria-hidden="true">🐾</span>
        <span class="brand-text">
          <span class="brand-title">組合</span>
          <span class="tagline">全倉市值</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="導覽">
        <a href="index.html">養成</a>
        <a href="portfolio.html" class="active">組合</a>
      </nav>
    </header>

    <div id="statusBanner" class="banner" hidden></div>
    <span id="asOfLabel" hidden></span>

    <section class="card hero-portfolio">
      <p class="hero-kicker">總市值</p>
      <div class="big-num" id="totalValue">—</div>
      <p class="quiet-split">
        <span>現金 <strong id="cashVal">—</strong></span>
        <span class="sep">·</span>
        <span>持倉 <strong id="posVal">—</strong></span>
      </p>
      <p class="fee-quiet">預估費用 <strong id="feeVal">—</strong> · 扣費後 <strong id="netVal">—</strong></p>
      <span id="feeFormula" hidden></span>
      <span id="feeDrag" hidden></span>
    </section>

    <section class="card">
      <h2 class="section-title">持倉</h2>
      <div class="holdings-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>項目</th>
              <th class="num">數量</th>
              <th class="num">HKD</th>
            </tr>
          </thead>
          <tbody id="holdingsBody">
            <tr><td colspan="3" class="loading">…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="prog-head">
        <h2 class="section-title">目標進度</h2>
        <span class="pct" id="progressPct">—%</span>
      </div>
      <p class="prog-sub" id="goalLine"></p>
      <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barTrack">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <p class="quiet-split">
        <span>尚欠 <strong id="gapVal">—</strong></span>
        <span class="sep">·</span>
        <span>每月 <strong id="monthlyVal">—</strong> <span id="monthsLeft"></span></span>
      </p>
    </section>

    <footer class="foot">
      <p class="note">費用為估算 · 帳戶結餘僅作參考</p>
    </footer>
  </main>

  <script>
  (() => {
    "use strict";
    function estimateFeeHkd(n) {
      n = Math.max(0, Number(n) || 0);
      return Math.max(8, n * 0.0008);
    }
    function formatHkd(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return "$" + v.toLocaleString("en-HK", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }
    function formatPct(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return v.toFixed(1) + "%";
    }
    function setBanner(type, msg) {
      const el = document.getElementById("statusBanner");
      if (!el) return;
      if (!msg) { el.hidden = true; return; }
      el.hidden = false;
      el.className = "banner " + type;
      el.textContent = msg;
    }
    function render(data) {
      const cash = Number(data.cashHkd) || 0;
      const posSum = Number(data.positionsHkd) || 0;
      const total = Number(data.totalApproxHkd) || cash + posSum;
      const goal = Number(data.goalHkd) || 48000;
      const monthly = Number(data.monthlyTargetHkd) || 0;
      const pct = goal > 0 ? (total / goal) * 100 : 0;
      const fee = estimateFeeHkd(total);
      const net = total - fee;

      document.getElementById("asOfLabel").textContent = data.asOf || "";
      document.getElementById("totalValue").textContent = formatHkd(total);
      document.getElementById("cashVal").textContent = formatHkd(cash);
      document.getElementById("posVal").textContent = formatHkd(posSum);
      document.getElementById("feeVal").textContent = formatHkd(fee);
      document.getElementById("netVal").textContent = formatHkd(net);

      let rows = `<tr><td>現金</td><td class="num">—</td><td class="num">${formatHkd(cash)}</td></tr>`;
      const positions = Array.isArray(data.positions) ? data.positions : [];
      for (const p of positions) {
        const sym = p.symbol || "?";
        const qty = p.qty != null ? Number(p.qty).toLocaleString("en-HK", { maximumFractionDigits: 4 }) : "—";
        rows += `<tr><td>${sym}</td><td class="num">${qty}</td><td class="num">${formatHkd(p.mktValueHkd)}</td></tr>`;
      }
      rows += `<tr class="total"><td>合計</td><td class="num"></td><td class="num">${formatHkd(total)}</td></tr>`;
      document.getElementById("holdingsBody").innerHTML = rows;

      document.getElementById("goalLine").textContent = "目標 " + formatHkd(goal);
      document.getElementById("progressPct").textContent = formatPct(pct);
      document.getElementById("barFill").style.width = Math.min(100, pct) + "%";
      document.getElementById("barTrack").setAttribute("aria-valuenow", String(Math.round(pct)));
      document.getElementById("gapVal").textContent = formatHkd(Math.max(0, goal - total));
      document.getElementById("monthlyVal").textContent = formatHkd(monthly);
      if (monthly > 0) {
        document.getElementById("monthsLeft").textContent =
          "（約 " + Math.ceil(Math.max(0, goal - total) / monthly) + " 個月）";
      }
      setBanner("", "");
    }

    fetch("data/savings_snapshot.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("fail"); return r.json(); })
      .then(render)
      .catch((err) => {
        setBanner("error", "暫時載入唔到，請稍後再試。");
        console.error(err);
      });
  })();
  </script>
</body>
</html>
