<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7F3EB" />
  <meta name="description" content="開支 · 小狗養成" />
  <title>開支 · 小狗養成</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="shell portfolio-shell">
    <header class="topbar">
      <a class="brand brand-link" href="index.html">
        <span class="brand-mark" aria-hidden="true">🧾</span>
        <span class="brand-text">
          <span class="brand-title">開支</span>
          <span class="tagline">近期消費</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="導覽">
        <a href="index.html">養成</a>
        <a href="portfolio.html">組合</a>
        <a href="expenses.html" class="active">開支</a>
      </nav>
    </header>

    <div id="statusBanner" class="banner" hidden></div>

    <section class="card hero-portfolio">
      <p class="hero-kicker">總開支</p>
      <div class="big-num" id="totalSpend">—</div>
      <p class="quiet-split">
        <span id="itemCount">— 筆</span>
        <span class="sep">·</span>
        <span id="asOfLabel">—</span>
      </p>
    </section>

    <section class="card">
      <h2 class="section-title">渠道</h2>
      <div class="exp-bars" id="byChannel"></div>
    </section>

    <section class="card">
      <h2 class="section-title">分類</h2>
      <div class="exp-bars" id="byCategory"></div>
    </section>

    <section class="card">
      <h2 class="section-title">按月</h2>
      <div class="exp-bars" id="byMonth"></div>
    </section>

    <section class="card">
      <h2 class="section-title">近期明細</h2>
      <div class="holdings-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>日期</th>
              <th>商戶</th>
              <th>渠道</th>
              <th class="num">金額</th>
            </tr>
          </thead>
          <tbody id="itemsBody">
            <tr><td colspan="4" class="loading">…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="foot">
      <p class="note">收據匯總 · 僅供參考</p>
    </footer>
  </main>

  <script>
  (() => {
    "use strict";

    const CAT_LABEL = {
      food: "飲食",
      transport: "交通",
      transfer: "轉帳",
      bills: "帳單",
      other: "其他",
    };
    const CH_LABEL = {
      Alipay: "支付寶",
      card: "卡",
      other: "其他",
    };

    function formatHkd(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return "—";
      return "$" + v.toLocaleString("en-HK", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function setBanner(msg) {
      const el = document.getElementById("statusBanner");
      if (!el) return;
      if (!msg) { el.hidden = true; return; }
      el.hidden = false;
      el.className = "banner error";
      el.textContent = msg;
    }

    function aggregate(items, keyFn) {
      const map = new Map();
      for (const it of items) {
        const k = keyFn(it) || "其他";
        map.set(k, (map.get(k) || 0) + (Number(it.amountHkd) || 0));
      }
      return [...map.entries()].sort((a, b) => b[1] - a[1]);
    }

    function renderBars(el, rows, total) {
      if (!el) return;
      if (!rows.length) {
        el.innerHTML = '<p class="loading">暫無數據</p>';
        return;
      }
      el.innerHTML = rows
        .map(([label, amt]) => {
          const pct = total > 0 ? Math.max(2, (amt / total) * 100) : 0;
          return (
            '<div class="exp-bar-row">' +
            '<div class="exp-bar-meta"><span>' + label + '</span><strong>' + formatHkd(amt) + '</strong></div>' +
            '<div class="exp-bar-track"><div class="exp-bar-fill" style="width:' + pct + '%"></div></div>' +
            "</div>"
          );
        })
        .join("");
    }

    function render(data) {
      const items = Array.isArray(data.items) ? data.items.slice() : [];
      items.sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const total = items.reduce((s, i) => s + (Number(i.amountHkd) || 0), 0);

      document.getElementById("totalSpend").textContent = formatHkd(total);
      document.getElementById("itemCount").textContent = items.length + " 筆";
      document.getElementById("asOfLabel").textContent = data.asOf ? "截至 " + data.asOf : "";

      const byCh = aggregate(items, (i) => CH_LABEL[i.channel] || i.channel || "其他");
      const byCat = aggregate(items, (i) => CAT_LABEL[i.category] || i.category || "其他");
      const byMo = aggregate(items, (i) => (i.date || "").slice(0, 7) || "—");

      renderBars(document.getElementById("byChannel"), byCh, total);
      renderBars(document.getElementById("byCategory"), byCat, total);
      renderBars(document.getElementById("byMonth"), byMo, total);

      const recent = items.slice(0, 40);
      const body = document.getElementById("itemsBody");
      if (!recent.length) {
        body.innerHTML = '<tr><td colspan="4" class="loading">暫無明細</td></tr>';
      } else {
        body.innerHTML = recent
          .map((i) => {
            const mer = i.merchant && i.merchant !== "unknown" ? i.merchant : "—";
            const ch = CH_LABEL[i.channel] || i.channel || "—";
            return (
              "<tr>" +
              "<td>" + (i.date || "—") + "</td>" +
              "<td>" + mer + "</td>" +
              "<td>" + ch + "</td>" +
              '<td class="num">' + formatHkd(i.amountHkd) + "</td>" +
              "</tr>"
            );
          })
          .join("");
      }
      setBanner("");
    }

    fetch("data/expenses.json", { cache: "no-store" })
      .then((r) => {
        if (!r.ok) throw new Error("fail");
        return r.json();
      })
      .then(render)
      .catch((err) => {
        setBanner("暫時載入唔到，請稍後再試。");
        console.error(err);
      });
  })();
  </script>
</body>
</html>
